<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Bias BJT - Interactive</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 { color: #1e3c72; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 30px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        
        .flex {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .controls {
            flex: 1;
            min-width: 280px;
        }
        
        .waveform-area {
            flex: 1.5;
            min-width: 400px;
        }
        
        .slider-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .slider-group {
            margin-bottom: 20px;
        }
        
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        
        .result {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            border-left: 3px solid #667eea;
        }
        
        .result .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        
        .result .value {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
        }
        
        .warning {
            background: #fee2e2;
            border-left-color: #dc2626;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .phase-indicator {
            display: inline-block;
            background: #c41e3a;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 12px;
            font-size: 12px;
        }
        
        .legend span {
            display: inline-block;
            width: 30px;
            height: 3px;
            vertical-align: middle;
            margin-right: 5px;
        }
        
        .legend .blue { background: #2563eb; }
        .legend .red { background: #dc2626; }
        
        .wave-container {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #e2e8f0;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: white;
            border-radius: 8px;
        }
        
        .gain-bar {
            margin-top: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        
        .gain-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔬 Fixed Bias BJT Circuit</h1>
    <div class="subtitle">V<sub>CC</sub> = 28V | R<sub>C</sub> = 4.7kΩ | Common Emitter Amplifier</div>
    
    <div class="flex">
        <!-- Left Panel -->
        <div class="controls">
            <div class="slider-card">
                <h3 style="margin-top:0;">🎮 Control Panel</h3>
                
                <div class="slider-group">
                    <label>
                        <span>🔵 Current Gain <strong>β</strong></span>
                        <span class="badge" id="betaDisplay">110</span>
                    </label>
                    <input type="range" id="betaSlider" min="50" max="300" value="110" step="1">
                </div>
                
                <div class="slider-group">
                    <label>
                        <span>🟠 Base Resistor <strong>R<sub>B</sub></strong></span>
                        <span class="badge" id="rbDisplay">200 kΩ</span>
                    </label>
                    <input type="range" id="rbSlider" min="50" max="500" value="200" step="5">
                </div>
                
                <div class="slider-group">
                    <label>
                        <span>🟢 V<sub>BE</sub> (Silicon)</span>
                        <span class="badge" id="vbeDisplay">0.70 V</span>
                    </label>
                    <input type="range" id="vbeSlider" min="0.5" max="0.9" value="0.7" step="0.01">
                </div>
                
                <button id="resetBtn">⟳ Reset to Default Values</button>
            </div>
            
            <div class="slider-card">
                <h3 style="margin-top:0;">📊 Calculated Values</h3>
                <div id="results" class="results"></div>
            </div>
        </div>
        
        <!-- Right Panel - Waveform -->
        <div class="waveform-area">
            <div class="wave-container">
                <div>
                    <span class="phase-indicator" id="phaseBadge">⏪ 180° Phase Shift</span>
                </div>
                
                <canvas id="waveCanvas" width="600" height="200" style="width:100%; height:auto; background:#fff; border-radius:8px; border:1px solid #ddd"></canvas>
                
                <div class="legend">
                    <div><span class="blue"></span> V<sub>in</sub> (Input - ثابت)</div>
                    <div><span class="red"></span> V<sub>out</sub> (Output - يتغير مع β و R<sub>B</sub>!)</div>
                </div>
                
                <div class="gain-bar">
                    <div class="gain-fill" id="gainFill"></div>
                </div>
                <div style="text-align: center; margin-top: 8px; font-size: 12px; color: #666;">
                    <span id="gainValueText">Current Gain: 0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Constants
    const VCC = 28;
    const RC = 4.7;
    const VT = 0.026;
    
    // Variables
    let beta = 110;
    let RB = 200;
    let VBE = 0.7;
    
    // Canvas setup
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    
    // Set fixed canvas dimensions
    canvas.width = 600;
    canvas.height = 200;
    
    function calculate() {
        const IB_mA = (VCC - VBE) / RB;
        const IB_uA = IB_mA * 1000;
        const IC = beta * IB_mA;
        const VC = VCC - (IC * RC);
        const VCE = VC;
        const gm = IC / VT;
        const Av = -gm * RC;
        const PC = VCE * IC;
        const isSaturated = VCE < 0.3;
        const isNearSaturation = VCE < 1 && VCE >= 0.3;
        
        return { IB_uA, IC, VC, VCE, gm, Av, PC, isSaturated, isNearSaturation };
    }
    
    function drawWaveform() {
        const vals = calculate();
        const gain = Math.abs(vals.Av);
        
        // CRITICAL: Output amplitude changes DRAMATICALLY with gain
        let outputAmp = gain / 2.5;
        outputAmp = Math.min(70, Math.max(4, outputAmp));
        
        const inputAmp = 18;
        const centerY = canvas.height / 2;
        
        // Clear with white background
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw grid
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * canvas.width / 4, 0);
            ctx.lineTo(i * canvas.width / 4, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * canvas.height / 4);
            ctx.lineTo(canvas.width, i * canvas.height / 4);
            ctx.stroke();
        }
        
        // Zero line
        ctx.beginPath();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.moveTo(0, centerY);
        ctx.lineTo(canvas.width, centerY);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Draw INPUT (Blue) - FIXED
        ctx.beginPath();
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2.5;
        for (let x = 0; x <= canvas.width; x++) {
            const t = (x / canvas.width) * 4 * Math.PI;
            const y = centerY + inputAmp * Math.sin(t);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        // Draw OUTPUT (Red) - CHANGES WITH GAIN
        ctx.beginPath();
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 2.5;
        for (let x = 0; x <= canvas.width; x++) {
            const t = (x / canvas.width) * 4 * Math.PI;
            // 180 degree phase shift
            let y = centerY + outputAmp * Math.sin(t + Math.PI);
            y = Math.min(canvas.height - 10, Math.max(10, y));
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        // Labels
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = '#2563eb';
        ctx.fillText('V_in (Input) - ثابت', 10, centerY - inputAmp - 3);
        ctx.fillStyle = '#dc2626';
        ctx.fillText(`V_out (Output) |A_v| = ${gain.toFixed(1)}`, 10, centerY - outputAmp - 3);
        
        // Draw amplitude indicator
        ctx.fillStyle = '#667eea';
        ctx.fillRect(canvas.width - 100, 10, Math.min(90, gain / 2), 6);
        ctx.fillStyle = '#333';
        ctx.font = '10px Arial';
        ctx.fillText(`Gain: ${gain.toFixed(1)}`, canvas.width - 100, 25);
        
        // Update gain bar
        const fillPercent = Math.min(100, (gain / 150) * 100);
        document.getElementById('gainFill').style.width = fillPercent + '%';
        document.getElementById('gainValueText').innerHTML = `|A<sub>v</sub>| = ${gain.toFixed(1)} V/V`;
        
        // Saturation warning on canvas
        if (vals.isSaturated) {
            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 10px Arial';
            ctx.fillText('⚠️ SATURATION! Increase R_B', canvas.width - 170, canvas.height - 8);
        } else if (vals.isNearSaturation) {
            ctx.fillStyle = '#f59e0b';
            ctx.font = '10px Arial';
            ctx.fillText('⚠️ Near Saturation', canvas.width - 120, canvas.height - 8);
        }
    }
    
    function updateUI() {
        const vals = calculate();
        const gain = Math.abs(vals.Av);
        
        // Update displays
        document.getElementById('betaDisplay').innerHTML = beta;
        document.getElementById('rbDisplay').innerHTML = RB + ' kΩ';
        document.getElementById('vbeDisplay').innerHTML = VBE.toFixed(2) + ' V';
        
        // Update phase badge
        const badge = document.getElementById('phaseBadge');
        if (vals.isSaturated) {
            badge.innerHTML = '⚠️ SATURATION MODE - Amplifier Not Working!';
            badge.style.background = '#dc2626';
        } else if (vals.isNearSaturation) {
            badge.innerHTML = '⚠️ Near Saturation - Increase R_B';
            badge.style.background = '#f59e0b';
        } else {
            badge.innerHTML = '⏪ 180° Phase Shift | Active Region';
            badge.style.background = '#c41e3a';
        }
        
        // Update results
        const warningClass = vals.isSaturated ? 'warning' : '';
        document.getElementById('results').innerHTML = `
            <div class="result ${warningClass}">
                <div class="label">Base Current I<sub>B</sub></div>
                <div class="value">${vals.IB_uA.toFixed(2)} μA</div>
            </div>
            <div class="result ${warningClass}">
                <div class="label">Collector Current I<sub>C</sub></div>
                <div class="value">${vals.IC.toFixed(2)} mA</div>
            </div>
            <div class="result ${warningClass}">
                <div class="label">Collector Voltage V<sub>C</sub></div>
                <div class="value">${vals.VC.toFixed(2)} V</div>
            </div>
            <div class="result ${warningClass}">
                <div class="label">V<sub>CE</sub></div>
                <div class="value">${vals.VCE.toFixed(2)} V</div>
            </div>
            <div class="result">
                <div class="label">Transconductance g<sub>m</sub></div>
                <div class="value">${vals.gm.toFixed(3)} S</div>
            </div>
            <div class="result">
                <div class="label">Voltage Gain A<sub>v</sub></div>
                <div class="value">${vals.Av.toFixed(1)} V/V</div>
            </div>
            <div class="result">
                <div class="label">|A<sub>v</sub>| (Magnitude)</div>
                <div class="value">${gain.toFixed(1)} V/V</div>
            </div>
            <div class="result">
                <div class="label">Power P<sub>C</sub></div>
                <div class="value">${vals.PC.toFixed(1)} mW</div>
            </div>
        `;
        
        // Draw waveform
        drawWaveform();
    }
    
    // Event listeners
    document.getElementById('betaSlider').addEventListener('input', function(e) {
        beta = parseInt(e.target.value);
        updateUI();
    });
    
    document.getElementById('rbSlider').addEventListener('input', function(e) {
        RB = parseInt(e.target.value);
        updateUI();
    });
    
    document.getElementById('vbeSlider').addEventListener('input', function(e) {
        VBE = parseFloat(e.target.value);
        updateUI();
    });
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        document.getElementById('betaSlider').value = '110';
        document.getElementById('rbSlider').value = '200';
        document.getElementById('vbeSlider').value = '0.7';
        beta = 110;
        RB = 200;
        VBE = 0.7;
        updateUI();
    });
    
    // Initial draw
    updateUI();
    
    // Debug
    console.log('Script loaded. Canvas size:', canvas.width, 'x', canvas.height);
</script>
</body>
</html>
